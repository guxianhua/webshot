<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>管理端 - 网站巡检系统</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; background: #f5f6fa; color: #333; }
        .container { max-width: 1400px; margin: 0 auto; padding: 20px; }
        header { background: #fff; padding: 20px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); margin-bottom: 20px; display: flex; justify-content: space-between; align-items: center; }
        header h1 { font-size: 24px; color: #2c3e50; }
        .back-link { color: #409eff; text-decoration: none; font-size: 14px; }
        .back-link:hover { text-decoration: underline; }
        .upload-area { background: #fff; border: 2px dashed #dcdfe6; border-radius: 8px; padding: 40px; text-align: center; margin-bottom: 20px; cursor: pointer; transition: border-color 0.3s; }
        .upload-area:hover, .upload-area.dragover { border-color: #409eff; }
        .upload-area input { display: none; }
        .upload-area p { color: #606266; font-size: 16px; }
        .upload-area .hint { font-size: 12px; color: #f56c6c; margin-top: 8px; }
        .file-meta { background: #fff; border-radius: 8px; padding: 14px 20px; margin-bottom: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); display: flex; justify-content: space-between; align-items: center; }
        .file-meta .label { font-size: 13px; color: #909399; margin-right: 8px; }
        .file-meta .name { font-size: 15px; color: #303133; font-weight: 500; }

        .section { background: #fff; border-radius: 8px; padding: 20px; margin-bottom: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
        .section-title { font-size: 18px; font-weight: 600; margin-bottom: 16px; color: #2c3e50; }
        .status-bar { background: #f0f9eb; padding: 12px 16px; border-radius: 4px; margin-bottom: 16px; display: flex; justify-content: space-between; align-items: center; }
        .status-bar.success span { color: #67c23a; font-weight: 500; }
        table { width: 100%; border-collapse: collapse; font-size: 14px; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid #ebeef5; }
        th { background: #f5f7fa; color: #606266; font-weight: 600; }
        tr:hover { background: #f5f7fa; }
        .hidden { display: none; }
        .empty-hint { text-align: center; color: #909399; padding: 30px; }
        .btn { display: inline-block; padding: 6px 12px; border: none; border-radius: 4px; font-size: 12px; cursor: pointer; transition: all 0.3s; }
        .btn-edit { background: #409eff; color: #fff; }
        .btn-edit:hover { background: #66b1ff; }
        .btn-delete { background: #f56c6c; color: #fff; }
        .btn-delete:hover { background: #f78989; }
        .btn-save { background: #67c23a; color: #fff; }
        .btn-save:hover { background: #85ce61; }
        .toolbar { display: flex; gap: 10px; margin-bottom: 16px; align-items: center; }
        .edit-input { padding: 4px 8px; border: 1px solid #dcdfe6; border-radius: 4px; font-size: 13px; width: 100%; }
        .edit-input:focus { outline: none; border-color: #409eff; }
        .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.5); display: none; justify-content: center; align-items: center; z-index: 1000; }
        .modal-overlay.active { display: flex; }
        .modal { background: #fff; border-radius: 8px; padding: 24px; width: 500px; max-width: 90vw; }
        .modal h3 { margin-bottom: 16px; font-size: 18px; }
        .modal label { display: block; margin-bottom: 8px; font-size: 14px; font-weight: 500; }
        .modal input, .modal select { width: 100%; padding: 10px; border: 1px solid #dcdfe6; border-radius: 4px; font-size: 14px; margin-bottom: 16px; }
        .modal input:focus { outline: none; border-color: #409eff; }
        .modal-actions { display: flex; justify-content: flex-end; gap: 10px; }
        .modal .btn { padding: 8px 20px; font-size: 14px; }
        .btn-secondary { background: #f5f7fa; color: #606266; }
        .btn-secondary:hover { background: #ebeef5; }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>管理端</h1>
            <a href="/" class="back-link">← 返回首页</a>
        </header>

        <div class="upload-area" id="uploadArea">
            <input type="file" id="fileInput" accept=".xlsx">
            <p>点击或拖拽上传网站列表 Excel 文件</p>
            <p class="hint">仅支持 .xlsx 格式（上传后将覆盖现有数据）</p>
        </div>

        <div id="fileMeta" class="file-meta hidden">
            <span class="label">当前数据来源：</span>
            <span class="name" id="fileName"></span>
        </div>

        <div id="siteSection" class="section">
            <div class="section-title">网站列表 <span id="siteCount" style="font-size:14px;color:#909399;font-weight:400"></span></div>
            <div id="emptyHint" class="empty-hint">暂无数据，请上传 Excel 文件</div>
            <table id="siteTable" class="hidden">
                <thead>
                    <tr><th>序号</th><th>名称</th><th>URL</th><th>责任单位</th><th>访问权限</th><th>操作</th></tr>
                </thead>
                <tbody></tbody>
            </table>
        </div>
    </div>

    <div class="modal-overlay" id="editModal">
        <div class="modal">
            <h3>编辑网站</h3>
            <input type="hidden" id="editId">
            <label>名称</label>
            <input type="text" id="editName" placeholder="请输入名称">
            <label>URL</label>
            <input type="text" id="editUrl" placeholder="请输入网址">
            <label>责任单位</label>
            <input type="text" id="editUnit" placeholder="请输入责任单位">
            <label>访问权限</label>
            <input type="text" id="editAccess" placeholder="如：互联网访问、校内访问">
            <div class="modal-actions">
                <button class="btn btn-secondary" onclick="closeModal()">取消</button>
                <button class="btn btn-save" onclick="saveEdit()">保存</button>
            </div>
        </div>
    </div>

    <script>
        let sites = [];
        const uploadArea = document.getElementById('uploadArea');
        const fileInput = document.getElementById('fileInput');

        uploadArea.addEventListener('click', () => fileInput.click());
        uploadArea.addEventListener('dragover', (e) => { e.preventDefault(); uploadArea.classList.add('dragover'); });
        uploadArea.addEventListener('dragleave', () => uploadArea.classList.remove('dragover'));
        uploadArea.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadArea.classList.remove('dragover');
            if (e.dataTransfer.files.length) handleFile(e.dataTransfer.files[0]);
        });
        fileInput.addEventListener('change', (e) => { if (e.target.files.length) handleFile(e.target.files[0]); });

        async function handleFile(file) {
            const ext = file.name.split('.').pop().toLowerCase();
            if (ext !== 'xlsx') {
                alert('只允许上传 .xlsx 文件');
                return;
            }
            if (sites.length > 0 && !confirm('确定要上传新文件覆盖现有数据吗？')) {
                return;
            }
            const form = new FormData();
            form.append('file', file);
            const res = await fetch('/api/upload', { method: 'POST', body: form });
            const data = await res.json();
            if (data.error) { alert(data.error); return; }
            sites = data.websites;
            renderSites();
            showFileMeta(file.name);
        }

        function showFileMeta(filename) {
            const meta = document.getElementById('fileMeta');
            const nameEl = document.getElementById('fileName');
            if (filename) {
                meta.classList.remove('hidden');
                nameEl.textContent = filename;
            } else {
                meta.classList.add('hidden');
            }
        }

        function renderSites() {
            document.getElementById('emptyHint').classList.add('hidden');
            document.getElementById('siteTable').classList.remove('hidden');
            document.getElementById('siteCount').textContent = `(${sites.length} 个)`;
            const tbody = document.querySelector('#siteTable tbody');
            tbody.innerHTML = sites.map(s => `
                <tr data-id="${s.id}">
                    <td>${s.id}</td>
                    <td>${s.name||''}</td>
                    <td>${s.url}</td>
                    <td>${s.unit||''}</td>
                    <td>${s.access||''}</td>
                    <td>
                        <button class="btn btn-edit" onclick="editSite(${s.id})">编辑</button>
                        <button class="btn btn-delete" onclick="deleteSite(${s.id})">删除</button>
                    </td>
                </tr>
            `).join('');
        }

        function editSite(id) {
            const site = sites.find(s => s.id === id);
            if (!site) return;
            document.getElementById('editId').value = site.id;
            document.getElementById('editName').value = site.name || '';
            document.getElementById('editUrl').value = site.url || '';
            document.getElementById('editUnit').value = site.unit || '';
            document.getElementById('editAccess').value = site.access || '';
            document.getElementById('editModal').classList.add('active');
        }

        function closeModal() {
            document.getElementById('editModal').classList.remove('active');
        }

        async function saveEdit() {
            const id = parseInt(document.getElementById('editId').value);
            const site = sites.find(s => s.id === id);
            if (!site) return;
            site.name = document.getElementById('editName').value.trim();
            site.url = document.getElementById('editUrl').value.trim();
            site.unit = document.getElementById('editUnit').value.trim();
            site.access = document.getElementById('editAccess').value.trim();
            await fetch('/api/sites/save', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ sites })
            });
            renderSites();
            closeModal();
            alert('修改已保存');
        }

        async function deleteSite(id) {
            if (!confirm('确定要删除这个网站吗？')) return;
            await fetch(`/api/sites/delete/${id}`, { method: 'DELETE' });
            sites = sites.filter(s => s.id !== id);
            renderSites();
        }

        async function loadSavedSites() {
            const res = await fetch('/api/sites');
            const data = await res.json();
            if (data.sites && data.sites.length > 0) {
                sites = data.sites;
                renderSites();
                const mres = await fetch('/api/sites/meta');
                const mdata = await mres.json();
                showFileMeta(mdata.filename);
            }
        }

        window.addEventListener('load', loadSavedSites);
    </script>
</body>
</html>
